; Upstream ships this file with every program logging to a file under
; /var/lib/server/logs, which leaves `railway logs` empty for the components most
; likely to need debugging. Every stream is redirected to the container's stdout
; instead, with rotation off so supervisor writes straight through.
[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0

[program:syncing-server]
directory=/opt/server/packages/syncing-server
command=/opt/server/packages/syncing-server/supervisor/supervisor-server.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:syncing-server-worker]
directory=/opt/server/packages/syncing-server
command=/opt/server/packages/syncing-server/supervisor/supervisor-worker.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:auth]
directory=/opt/server/packages/auth
command=/opt/server/packages/auth/supervisor/supervisor-server.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:auth-worker]
directory=/opt/server/packages/auth
command=/opt/server/packages/auth/supervisor/supervisor-worker.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:files]
directory=/opt/server/packages/files
command=/opt/server/packages/files/supervisor/supervisor-server.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:files-worker]
directory=/opt/server/packages/files
command=/opt/server/packages/files/supervisor/supervisor-worker.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:revisions]
directory=/opt/server/packages/revisions
command=/opt/server/packages/revisions/supervisor/supervisor-server.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:revisions-worker]
directory=/opt/server/packages/revisions
command=/opt/server/packages/revisions/supervisor/supervisor-worker.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:api-gateway]
directory=/opt/server/packages/api-gateway
command=/opt/server/packages/api-gateway/supervisor/supervisor-server.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; Caddy fronts the API gateway and the files server on Railway's $PORT; see
; server/Caddyfile. It is started last so the backends are already coming up.
[program:caddy]
directory=/etc/caddy
command=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
